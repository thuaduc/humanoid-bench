<svg aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="-8 -8 1050 1100" style="max-width: 1050px;" xmlns="http://www.w3.org/2000/svg" width="100%" id="factored-actor-diagram">
<style>
#factored-actor-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#f6f6f4;}
#factored-actor-diagram .error-icon{fill:#5a1d1d;}
#factored-actor-diagram .error-text{fill:#ee6666;stroke:#ee6666;}
#factored-actor-diagram .edge-thickness-normal{stroke-width:2px;}
#factored-actor-diagram .edge-thickness-thick{stroke-width:3.5px;}
#factored-actor-diagram .edge-pattern-solid{stroke-dasharray:0;}
#factored-actor-diagram .edge-pattern-dashed{stroke-dasharray:3;}
#factored-actor-diagram .edge-pattern-dotted{stroke-dasharray:2;}
#factored-actor-diagram .marker{fill:#f6f6f4;stroke:#f6f6f4;}
#factored-actor-diagram .marker.cross{stroke:#f6f6f4;}
#factored-actor-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}
#factored-actor-diagram .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#f6f6f4;}
#factored-actor-diagram .cluster-label text{fill:#f6f6f4;}
#factored-actor-diagram .cluster-label span,#factored-actor-diagram p{color:#f6f6f4;}
#factored-actor-diagram .label text,#factored-actor-diagram span,#factored-actor-diagram p{fill:#f6f6f4;color:#f6f6f4;}
#factored-actor-diagram .node rect,#factored-actor-diagram .node circle,#factored-actor-diagram .node ellipse,#factored-actor-diagram .node polygon,#factored-actor-diagram .node path{fill:#282a36;stroke:#454545;stroke-width:1px;}
#factored-actor-diagram .flowchart-label text{text-anchor:middle;}
#factored-actor-diagram .node .label{text-align:center;}
#factored-actor-diagram .node.clickable{cursor:pointer;}
#factored-actor-diagram .arrowheadPath{fill:#d7d5c9;}
#factored-actor-diagram .edgePath .path{stroke:#f6f6f4;stroke-width:2.0px;}
#factored-actor-diagram .flowchart-link{stroke:#f6f6f4;fill:none;}
#factored-actor-diagram .edgeLabel{background-color:#282a3699;text-align:center;}
#factored-actor-diagram .edgeLabel rect{opacity:0.5;background-color:#282a3699;fill:#282a3699;}
#factored-actor-diagram .labelBkg{background-color:rgba(40, 42, 54, 0.5);}
#factored-actor-diagram .cluster rect{fill:rgba(68, 71, 90, 0.5);stroke:#454545;stroke-width:1px;}
#factored-actor-diagram .cluster text{fill:#f6f6f4;}
#factored-actor-diagram .cluster span,#factored-actor-diagram p{color:#f6f6f4;}
#factored-actor-diagram div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:#44475a;border:1px solid #454545;border-radius:2px;pointer-events:none;z-index:100;}
#factored-actor-diagram .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#f6f6f4;}
#factored-actor-diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}
#factored-actor-diagram .highlight-box{fill:#ff79c6;fill-opacity:0.1;stroke:#ff79c6;stroke-width:2px;stroke-dasharray:5,5;}
</style>

<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <polygon points="0 0, 10 3, 0 6" fill="#f6f6f4" />
  </marker>
</defs>

<!-- Input Layer -->
<g id="input-layer">
  <rect x="0" y="0" width="1020" height="120" rx="5" class="cluster"/>
  <text x="510" y="25" text-anchor="middle" class="cluster-label" font-weight="bold">Input</text>
  
  <!-- Root Features -->
  <rect x="50" y="50" width="230" height="50" rx="3" fill="#282a36" stroke="#8be9fd" stroke-width="2"/>
  <text x="165" y="80" text-anchor="middle" fill="#f6f6f4">Root Features</text>
  <text x="165" y="95" text-anchor="middle" fill="#8be9fd" font-size="12">(in_object_nf: dynamic)</text>
  
  <!-- Joint Features -->
  <rect x="320" y="50" width="660" height="50" rx="3" fill="#282a36" stroke="#50fa7b" stroke-width="2"/>
  <text x="650" y="80" text-anchor="middle" fill="#f6f6f4">Joint Features (num_joints x 5)</text>
  <text x="650" y="95" text-anchor="middle" fill="#50fa7b" font-size="12">[pos, vel, xanchor_x, xanchor_y, xanchor_z]</text>
</g>

<!-- Parsing & Grouping -->
<g id="parsing-layer">
  <rect x="0" y="150" width="1020" height="280" rx="5" class="cluster"/>
  <text x="510" y="175" text-anchor="middle" class="cluster-label" font-weight="bold">Kinematic Structure Parsing</text>
  
  <!-- Root -->
  <rect x="40" y="200" width="110" height="50" rx="3" fill="#282a36" stroke="#8be9fd" stroke-width="2"/>
  <text x="95" y="230" text-anchor="middle" fill="#8be9fd" font-size="14">Root</text>
  
  <!-- Torso -->
  <rect x="175" y="200" width="110" height="50" rx="3" fill="#282a36" stroke="#bd93f9" stroke-width="2"/>
  <text x="230" y="230" text-anchor="middle" fill="#bd93f9" font-size="14">Torso (1j)</text>
  
  <!-- Left Leg -->
  <rect x="40" y="270" width="110" height="50" rx="3" fill="#282a36" stroke="#50fa7b" stroke-width="2"/>
  <text x="95" y="295" text-anchor="middle" fill="#50fa7b" font-size="14">Left Leg</text>
  <text x="95" y="310" text-anchor="middle" fill="#50fa7b" font-size="11">(5 joints)</text>
  
  <!-- Right Leg -->
  <rect x="175" y="270" width="110" height="50" rx="3" fill="#282a36" stroke="#50fa7b" stroke-width="2"/>
  <text x="230" y="295" text-anchor="middle" fill="#50fa7b" font-size="14">Right Leg</text>
  <text x="230" y="310" text-anchor="middle" fill="#50fa7b" font-size="11">(5 joints)</text>
  
  <!-- Left Arm -->
  <rect x="310" y="270" width="110" height="50" rx="3" fill="#282a36" stroke="#ffb86c" stroke-width="2"/>
  <text x="365" y="295" text-anchor="middle" fill="#ffb86c" font-size="14">Left Arm</text>
  <text x="365" y="310" text-anchor="middle" fill="#ffb86c" font-size="11">(6 joints)</text>
  
  <!-- Right Arm -->
  <rect x="445" y="270" width="110" height="50" rx="3" fill="#282a36" stroke="#ffb86c" stroke-width="2"/>
  <text x="500" y="295" text-anchor="middle" fill="#ffb86c" font-size="14">Right Arm</text>
  <text x="500" y="310" text-anchor="middle" fill="#ffb86c" font-size="11">(6 joints)</text>
  
  <!-- Left Hand -->
  <rect x="580" y="270" width="110" height="50" rx="3" fill="#282a36" stroke="#ff79c6" stroke-width="2"/>
  <text x="635" y="295" text-anchor="middle" fill="#ff79c6" font-size="14">Left Hand</text>
  <text x="635" y="310" text-anchor="middle" fill="#ff79c6" font-size="11">(24 joints)</text>
  
  <!-- Right Hand -->
  <rect x="715" y="270" width="110" height="50" rx="3" fill="#282a36" stroke="#ff79c6" stroke-width="2"/>
  <text x="770" y="295" text-anchor="middle" fill="#ff79c6" font-size="14">Right Hand</text>
  <text x="770" y="310" text-anchor="middle" fill="#ff79c6" font-size="11">(24 joints)</text>
  
  <!-- Removed extra joints box -->
  
  <!-- Mirroring annotation -->
  <text x="230" y="360" text-anchor="middle" fill="#ff5555" font-size="12" font-style="italic">Mirror y-component</text>
  <text x="500" y="360" text-anchor="middle" fill="#ff5555" font-size="12" font-style="italic">Mirror y-component</text>
  <text x="770" y="360" text-anchor="middle" fill="#ff5555" font-size="12" font-style="italic">Mirror y-component</text>
</g>

<!-- Arrows from input to parsing -->
<line x1="165" y1="100" x2="95" y2="200" stroke="#8be9fd" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="450" y1="100" x2="230" y2="200" stroke="#bd93f9" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="400" y1="100" x2="95" y2="270" stroke="#50fa7b" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="480" y1="100" x2="230" y2="270" stroke="#50fa7b" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="560" y1="100" x2="365" y2="270" stroke="#ffb86c" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="640" y1="100" x2="500" y2="270" stroke="#ffb86c" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="720" y1="100" x2="635" y2="270" stroke="#ff79c6" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="800" y1="100" x2="770" y2="270" stroke="#ff79c6" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- Encoding Layer -->
<g id="encoding-layer">
  <rect x="0" y="460" width="1020" height="200" rx="5" class="cluster"/>
  <text x="510" y="485" text-anchor="middle" class="cluster-label" font-weight="bold">Factored Encoding with Weight Sharing</text>
  
  <!-- Root Encoder -->
  <rect x="40" y="510" width="130" height="80" rx="3" fill="#282a36" stroke="#8be9fd" stroke-width="2"/>
  <text x="105" y="540" text-anchor="middle" fill="#8be9fd" font-size="13">Root Encoder</text>
  <text x="105" y="560" text-anchor="middle" fill="#8be9fd" font-size="11">in_object_nf</text>
  <text x="105" y="575" text-anchor="middle" fill="#8be9fd" font-size="11">-&gt; 128d</text>
  
  <!-- Torso Encoder -->
  <rect x="190" y="510" width="130" height="80" rx="3" fill="#282a36" stroke="#bd93f9" stroke-width="2"/>
  <text x="255" y="540" text-anchor="middle" fill="#bd93f9" font-size="13">Torso Encoder</text>
  <text x="255" y="560" text-anchor="middle" fill="#bd93f9" font-size="11">5d -&gt; 48d</text>
  
  <!-- Shared Leg Encoder -->
  <rect x="340" y="510" width="130" height="80" rx="3" fill="#282a36" stroke="#50fa7b" stroke-width="2"/>
  <text x="405" y="530" text-anchor="middle" fill="#50fa7b" font-size="13" font-weight="bold">Leg Encoder</text>
  <text x="405" y="545" text-anchor="middle" fill="#50fa7b" font-size="11">25d -&gt; 96d</text>
  <text x="405" y="560" text-anchor="middle" fill="#50fa7b" font-size="10" font-style="italic">(shared)</text>
  <rect x="342" y="512" width="126" height="76" rx="3" class="highlight-box"/>
  <text x="405" y="575" text-anchor="middle" fill="#50fa7b" font-size="10">Left + Right</text>
  
  <!-- Shared Arm Encoder -->
  <rect x="490" y="510" width="130" height="80" rx="3" fill="#282a36" stroke="#ffb86c" stroke-width="2"/>
  <text x="555" y="530" text-anchor="middle" fill="#ffb86c" font-size="13" font-weight="bold">Arm Encoder</text>
  <text x="555" y="545" text-anchor="middle" fill="#ffb86c" font-size="11">25d -&gt; 96d</text>
  <text x="555" y="560" text-anchor="middle" fill="#ffb86c" font-size="10" font-style="italic">(shared)</text>
  <rect x="492" y="512" width="126" height="76" rx="3" class="highlight-box"/>
  <text x="555" y="575" text-anchor="middle" fill="#ffb86c" font-size="10">Left + Right</text>
  
  <!-- Shared Hand Encoder -->
  <rect x="640" y="510" width="130" height="80" rx="3" fill="#282a36" stroke="#ff79c6" stroke-width="2"/>
  <text x="705" y="530" text-anchor="middle" fill="#ff79c6" font-size="13" font-weight="bold">Hand Encoder</text>
  <text x="705" y="545" text-anchor="middle" fill="#ff79c6" font-size="11">120d -&gt; 144d</text>
  <text x="705" y="560" text-anchor="middle" fill="#ff79c6" font-size="10" font-style="italic">(shared)</text>
  <rect x="642" y="512" width="126" height="76" rx="3" class="highlight-box"/>
  <text x="705" y="575" text-anchor="middle" fill="#ff79c6" font-size="10">Left + Right</text>
</g>

<!-- Arrows from parsing to encoding -->
<line x1="95" y1="250" x2="105" y2="510" stroke="#8be9fd" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="230" y1="250" x2="255" y2="510" stroke="#bd93f9" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="95" y1="320" x2="380" y2="510" stroke="#50fa7b" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="230" y1="320" x2="420" y2="510" stroke="#50fa7b" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="365" y1="320" x2="530" y2="510" stroke="#ffb86c" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="500" y1="320" x2="570" y2="510" stroke="#ffb86c" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="635" y1="320" x2="680" y2="510" stroke="#ff79c6" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="770" y1="320" x2="720" y2="510" stroke="#ff79c6" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- Action Head -->
<g id="action-layer">
  <rect x="0" y="690" width="1020" height="140" rx="5" class="cluster"/>
  <text x="510" y="715" text-anchor="middle" class="cluster-label" font-weight="bold">Action Head (Global Coordination)</text>
  
  <rect x="200" y="740" width="620" height="60" rx="3" fill="#282a36" stroke="#f1fa8c" stroke-width="2"/>
  <text x="510" y="765" text-anchor="middle" fill="#f1fa8c" font-size="14">Action Head MLP</text>
  <text x="510" y="785" text-anchor="middle" fill="#f1fa8c" font-size="12">Concat(root, torso, legs, arms, hands) -&gt; 368d + ReLU -&gt; n_act + Tanh</text>
</g>

<!-- Arrows from encoding to action head -->
<line x1="105" y1="590" x2="310" y2="740" stroke="#8be9fd" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="255" y1="590" x2="380" y2="740" stroke="#bd93f9" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="405" y1="590" x2="450" y2="740" stroke="#50fa7b" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="555" y1="590" x2="530" y2="740" stroke="#ffb86c" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="705" y1="590" x2="610" y2="740" stroke="#ff79c6" stroke-width="2" marker-end="url(#arrowhead)"/>

<!-- Output -->
<g id="output-layer">
  <rect x="0" y="860" width="1020" height="100" rx="5" class="cluster"/>
  <text x="510" y="885" text-anchor="middle" class="cluster-label" font-weight="bold">Output</text>
  
  <rect x="300" y="910" width="420" height="40" rx="3" fill="#282a36" stroke="#ff5555" stroke-width="2"/>
  <text x="510" y="935" text-anchor="middle" fill="#ff5555" font-size="14">Actions (n_act dimensions)</text>
</g>

<!-- Arrow from action head to output -->
<line x1="510" y1="800" x2="510" y2="910" stroke="#f1fa8c" stroke-width="3" marker-end="url(#arrowhead)"/>

<!-- Key Features Annotation -->
<g id="annotations">
  <text x="1010" y="520" text-anchor="end" fill="#50fa7b" font-size="11" font-weight="bold">+ Bilateral symmetry</text>
  <text x="1010" y="540" text-anchor="end" fill="#50fa7b" font-size="11" font-weight="bold">+ Weight sharing</text>
  <text x="1010" y="560" text-anchor="end" fill="#50fa7b" font-size="11" font-weight="bold">+ Factored encoding</text>
  <text x="1010" y="580" text-anchor="end" fill="#50fa7b" font-size="11" font-weight="bold">+ Kinematic structure</text>
</g>

<!-- Legend -->
<g id="legend">
  <text x="20" y="1020" fill="#8be9fd" font-size="11">-- Root/Global</text>
  <text x="150" y="1020" fill="#bd93f9" font-size="11">-- Torso</text>
  <text x="250" y="1020" fill="#50fa7b" font-size="11">-- Legs (5 each)</text>
  <text x="380" y="1020" fill="#ffb86c" font-size="11">-- Arms (5 each)</text>
  <text x="520" y="1020" fill="#ff79c6" font-size="11">-- Shadow Hands (24 each)</text>
  <text x="740" y="1020" fill="#f1fa8c" font-size="11">-- Action Head</text>
  <text x="880" y="1020" fill="#ff5555" font-size="11">-- Actions</text>
</g>

</svg>
